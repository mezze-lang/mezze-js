[package]
name    = "mezze-js"
version = "0.2.1"

# Two library entry points, both re-exported to consumers via the
# package's snake_case module name `mezze_js`:
#   use mezze_js::js::{ Js, GraalJs, JsForeign, ... }
#   use mezze_js::codec::{ ToJs, FromJs, JsC }
#
# ModuleResolver.resolveModuleFile walks `.deps/mezze/mezze_js-*/src/`
# so `mezze_js::js` resolves to `src/js.mz` etc. without any
# explicit [lib] entry — the search paths already cover the layout.

# ─── polyglot provider ────────────────────────────────────────────
#
# Declares this package as the `js` polyglot provider.
# `mez sync` picks the install template up when a user project has
# `[polyglot.js]` with npm specifiers. `npm` is expected on PATH —
# on machines without a system Node, `nix shell nixpkgs#nodejs -- mez
# sync` supplies one for the duration of the sync. `{dest}` expands
# to `runtime_dir` under the user project's root; `{prefix}` (the
# provider package's on-disk location) is unused by this template
# but still substituted by `mez sync`.
#
# `npm install --prefix <dir> <pkgs>` treats <dir> as its CWD and
# drops modules into `<dir>/node_modules/<pkg>/`. So we point
# `runtime_dir` at `.deps/node` and rely on npm's natural layout —
# packages land at `.deps/node/node_modules/<pkg>/` and the GraalJS
# Context reads `NODE_PATH=.deps/node/node_modules` at startup, so
# `require(...)` resolves them without any user override. Prior
# 0.2.0 pointed `runtime_dir` at `.deps/node/node_modules`, which
# forced user projects to set `node_modules =
# ".deps/node/node_modules/node_modules"` — one directory too many.
[polyglot.provider]
language      = "js"
install       = "npm install --prefix {dest} {packages}"
runtime_env   = "NODE_PATH"
runtime_dir   = ".deps/node"

# ─── Maven coordinates ─────────────────────────────────────────────
#
# Every entry lands on the wire-child JVM classpath via Aether's
# resolution into `~/.mezze/cache/maven/`. Transitive deps come
# along for free (this is why `[maven]` supersedes `[jars]` — no
# manual sha bookkeeping, real dependency management).
#
# Maven Central hosts the GraalJS jars; the mezze-lang maven repo
# hosts `polyglot-js-natives`. Both are declared below.
[maven]
"org.graalvm.js:js-language"           = "25.0.3"
"org.graalvm.js:js-scriptengine"       = "25.0.3"
"dev.mezze:polyglot-js-natives"        = "0.1.0"

[[maven-repo]]
id  = "mezze-lang"
url = "https://raw.githubusercontent.com/mezze-lang/mezze-maven/main/"
